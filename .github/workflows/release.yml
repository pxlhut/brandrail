name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # Calls the same CI workflow (including the conformance suite against a
  # real Postgres) as its own gate, rather than assuming a passing run
  # already happened elsewhere. A broken adapter fails *this*, before
  # `changesets/action` ever gets to publish.
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Belt-and-suspenders alongside NODE_AUTH_TOKEN below: setup-node's own
      # generated .npmrc is what `NPM_CONFIG_USERCONFIG` points plain `npm`
      # at, but pnpm's own config resolution doesn't reliably pick that file
      # up the same way, so the auth line is written explicitly too.
      #
      # (`npm whoami` briefly lived here as a debug step and reliably 401'd —
      # a red herring: npm now refuses *identity* actions like whoami for a
      # Bypass-2FA token even though the same token works fine for publish,
      # its actual intended use. See docs.npmjs.com/about-access-tokens.)
      - name: Configure npm auth for pnpm publish
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Opens/updates a "Version Packages" PR when changesets are pending;
      # publishes to npm (via `pnpm release`, which builds then runs
      # `changeset publish`) when that PR is merged and no changesets remain.
      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # `actions/setup-node`'s `registry-url` writes an `.npmrc` that reads
          # *this* env var specifically — `NPM_TOKEN` alone (above) is what
          # `changesets/action` itself looks for, but the actual `npm publish`
          # underneath authenticates via `NODE_AUTH_TOKEN`. Without it the
          # publish runs unauthenticated and npm returns 404, not 401.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
