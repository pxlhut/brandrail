name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lets release.yml call this workflow directly, so a release gates on
  # exactly the same conformance matrix a normal PR does — not a
  # hand-maintained duplicate of these steps.
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    # @pxlhut/brand-store-lucid (step 14) runs the step 11 conformance
    # suite against a real Postgres, not a mock — the acceptance criterion
    # the whole package exists to satisfy. These defaults match
    # `packages/brand-store-lucid/src/store/test-support/database.ts`'s
    # own `PG*` env var defaults exactly, so no extra env is needed below.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: own_branding_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Runs first: brand-store (step 10) imports types from brand-core's
      # published surface, which TypeScript resolves through brand-core's
      # own `dist/index.d.ts` (its package.json "types" field) — not through
      # its source. Typecheck can't succeed on a cross-package import until
      # that exists, so build has to come before it, not after.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Feature boundaries and the brand-core layering graph (DECISIONS.md).
      - name: Architecture rules
        run: pnpm arch

      # Also runs after build: proof 4's jsdom check imports the built
      # bundle, and proof 6's snapshot needs a fresh dist/ to compare
      # against nothing stale (step 09).
      - name: Test
        run: pnpm test

      # Minified + gzipped, core only, budgeted (step 09, proof 6).
      - name: Bundle size
        run: pnpm size

      # brand-core must stay browser-safe and must not grow a third
      # runtime dependency without a recorded decision. Runs after build
      # because it inspects the emitted bundle, not just the source.
      - name: Core purity
        run: pnpm purity

      # Step 11's conformance suite (@pxlhut/brand-store/conformance) needs
      # no separate CI matrix: every adapter's own test file calls
      # `runConformanceSuite` against itself, so `pnpm test` above already
      # runs it — the same way it already runs brand-store's own fixture
      # store against it. A real adapter (step 12, 14) picks this up for
      # free the moment it adds its own `*.test.ts` calling the suite.
      # Step 14's adapter is the one exception that needs infrastructure:
      # it runs the suite against real Postgres, hence the `postgres`
      # service block above.
